services:
  nginx:
    labels:
      - traefik.enable=true
      - traefik.http.routers.${WARDEN_ENV_NAME}-nginx-share.tls=true
      - traefik.http.routers.${WARDEN_ENV_NAME}-nginx-share.priority=2
      - traefik.http.routers.${WARDEN_ENV_NAME}-nginx-share.ruleSyntax=v2
      - traefik.http.routers.${WARDEN_ENV_NAME}-nginx-share.rule=
          HostRegexp(`{subdomain:.+}.${TRAEFIK_PUBLIC_DOMAIN}`) || Host(`${TRAEFIK_PUBLIC_DOMAIN}`)
      - traefik.http.services.${WARDEN_ENV_NAME}-nginx-share.loadbalancer.server.port=80
      - traefik.docker.network=${WARDEN_ENV_NAME}_default
      - dev.warden.share.domain=${TRAEFIK_PUBLIC_DOMAIN}
